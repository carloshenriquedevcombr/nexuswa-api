# ================================================================
# Nginx Proxy Manager → Proxy Host "wa.exemplo.com.br" → aba "Advanced"
# Cole o conteúdo abaixo em "Custom Nginx Configuration".
# Pré-requisito (uma única vez): criar /data/nginx/custom/http_top.conf (ver http_top.conf).
# ================================================================

# Corpo grande apenas o necessário para mídia em base64 (64 MB * 1.4)
client_max_body_size 100m;

# SSE (/sse) e envios com mídia podem demorar: sem buffer e com timeout maior
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 300s;

# Rate limit na borda (zona definida em http_top.conf) — primeira camada contra flood L7
limit_req zone=nexuswa_api burst=60 nodelay;
limit_req_status 429;
limit_conn nexuswa_conn 50;

# Nunca servir arquivos ocultos (.env, .git...) nem expor métricas publicamente
location ~ /\.(?!well-known) { deny all; return 404; }
location = /metrics { return 404; }

# Cabeçalhos de segurança redundantes (a API também envia via Helmet)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
