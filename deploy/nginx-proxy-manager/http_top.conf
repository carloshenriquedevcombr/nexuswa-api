# Arquivo: <volume de dados do NPM>/nginx/custom/http_top.conf
# (no container do NPM: /data/nginx/custom/http_top.conf) — depois reinicie o container do NPM.
# Define as zonas de rate limit usadas pelo advanced.conf do host da API.
limit_req_zone  $binary_remote_addr zone=nexuswa_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=nexuswa_conn:10m;
