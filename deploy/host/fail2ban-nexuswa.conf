# fail2ban — bane IPs que martelam a API com credenciais inválidas (401/403/423/429).
# 1) Salve o bloco [Definition] em /etc/fail2ban/filter.d/nexuswa.conf
# 2) Salve o bloco [nexuswa] em /etc/fail2ban/jail.d/nexuswa.local
# 3) Ajuste "logpath" para o log do proxy host da API no volume do NPM
#    (ex.: /root/docker-base/data/logs/proxy-host-7_access.log — o número é o ID do host)
# 4) systemctl restart fail2ban && fail2ban-client status nexuswa

[Definition]
failregex = ^\[.*\] - (401|403|423|429) \d+ - \w+ https? \S+ "[^"]*" \[Client <HOST>\]
ignoreregex =

[nexuswa]
enabled  = true
filter   = nexuswa
port     = http,https
logpath  = /CAMINHO/DO/NPM/data/logs/proxy-host-*_access.log
maxretry = 30
findtime = 300
bantime  = 3600
# Docker: bane na chain DOCKER-USER para valer também para containers
action   = iptables-allports[name=nexuswa, chain=DOCKER-USER]
