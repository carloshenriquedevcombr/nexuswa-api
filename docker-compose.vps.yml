# Produção na VPS, atrás do Nginx Proxy Manager (TLS/Let's Encrypt).
# A API NÃO publica porta: só é alcançável pelo NPM através da rede Docker dele.
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
services:
  api:
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"
    networks: [internal, proxy]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-docker-base_default}
